name: armenian-learning-assitant-be CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven # Speeds up builds by caching dependencies

      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Compile
        run: mvn clean compile

      - name: Run Tests
        run: mvn test

      - name: Verify
        # Committed sequence diagrams are deleted first, so one that mvn verify no longer regenerates (renamed,
        # deleted or untagged test) shows up as a deletion in the check below instead of staying silently stale.
        run: |
          rm -f docs/generated/sequence/*.genseq.*
          mvn verify

      - name: Check generated files are up to date
        # `mvn verify` regenerates openapi.yaml (OpenApiSpecIT) and docs/generated/*.puml (DataModelDiagramsIT)
        # and the sequence diagrams in docs/generated/sequence/ (SequenceDiagramExtension).
        # A diff here means the API, data model or traced call flow changed but the regenerated files were not committed.
        run: |
          if [ -n "$(git status --porcelain -- openapi.yaml docs/generated)" ]; then
            echo "::error::Generated files are stale. Merge the latest main, run 'mvn verify' locally and commit openapi.yaml and docs/generated/ (src:// links carry line numbers, so a change on main can also make them stale)."
            git status --porcelain -- openapi.yaml docs/generated
            git --no-pager diff -- openapi.yaml docs/generated
            exit 1
          fi

      - name: Restore Pitest history
        uses: actions/cache/restore@v6
        with:
          path: .pitest
          # Key per commit: matches exactly only on a re-run of the same commit; otherwise the prefixes below
          # restore the latest history from this ref, falling back to main.
          key: ${{ runner.os }}-pitest-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-pitest-${{ github.ref }}-
            ${{ runner.os }}-pitest-refs/heads/main-

      - name: Run Pitest
        run: mvn test-compile org.pitest:pitest-maven:mutationCoverage

      # Saved right after Pitest, so a failing later step (e.g. an expired SONAR_TOKEN) does not lose the history.
      # On a re-run of a commit that already saved, this logs "Unable to reserve cache" — harmless, caches are immutable.
      - name: Save Pitest history
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: .pitest
          key: ${{ runner.os }}-pitest-${{ github.ref }}-${{ github.sha }}

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            target/site/jacoco/
            target/site/jacoco-it/

      - name: Upload Pitest Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Attempt number keeps a re-run from overwriting the previous attempt's report.
          name: pitest-reports-attempt-${{ github.run_attempt }}
          path: target/pit-reports/
