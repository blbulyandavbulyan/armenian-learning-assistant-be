name: Auto Add Items to Project Board

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  add-to-project:
    name: Add item to project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2
        with:
          project-url: https://github.com/users/blbulyandavbulyan/projects/1
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}