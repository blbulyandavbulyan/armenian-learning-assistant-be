app:
  storage:
    local:
      folder-name: target/test-storage
  security:
    enabled: true
    cors:
      allowed-origin-patterns: "http://localhost:8081"
  piper:
    model-name: hy_AM-medium
    voice-identifier: gor-medium
logging:
  level:
    com.blbulyandavbulyan.larm: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: DEBUG
springdoc:
  # deterministic key order, so the committed openapi.yaml only changes when the API does
  writer-with-order-by-keys: true
management:
  tracing:
    sampling:
      probability: 1.0
spring:
  autoconfigure:
    exclude:
      # Modulith caches its module interceptors statically, so with several cached contexts in one JVM its module
      # spans reach the first context's registry and break parent chains in later ones.
      - org.springframework.modulith.observability.autoconfigure.ModuleObservabilityAutoConfiguration
