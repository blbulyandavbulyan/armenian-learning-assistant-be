server:
  forward-headers-strategy: framework
spring:
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterAccess=1h
  application:
    name: armenian-learning-assistant
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
    open-in-view: false

management:
  # Nothing is exported by default; enable explicitly where a collector exists
  tracing:
    export:
      otlp:
        # Enabling trace export needs management.opentelemetry.tracing.export.otlp.endpoint AND this flag
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        # Exposes the metrics and prometheus endpoints over HTTP
        include: "health,metrics,prometheus"
  endpoint:
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      # Optional: Automatically tags all metrics with your application name
      application: ${spring.application.name:armenian-learning-assistant}

jdbc:
  datasource-proxy:
    include-parameter-values: false
  includes: QUERY
