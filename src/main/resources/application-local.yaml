spring:
  datasource:
    password: secret
    username: myuser
    url: "jdbc:postgresql://localhost:5432/mydatabase"

  ai:
    google:
      genai:
        chat:
          options:
            model: gemini-3.1-flash-lite
        api-key: ${GEMINI_API_KEY}
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            dimensions: 3072
            model: gemini-embedding-001
  security:
    oauth2:
      resourceserver:
        jwt:
          jws-algorithms: ES256
          issuer-uri: https://jqpkdioktbnhdrsttyra.supabase.co/auth/v1
          jwk-set-uri: https://jqpkdioktbnhdrsttyra.supabase.co/auth/v1/.well-known/jwks.json
app:
  security:
    enabled: true
    cors:
      allowed-origin-patterns:
       - "http://localhost:*"
  storage:
    local:
      folder-name: ${STORAGE_FOLDER_NAME:/home/david/arm-learn-files}
  piper:
    url: http://localhost:5000
    # TODO hardcoding these properties here might not be the best choice to be honest, maybe we should get them from the webserver which we use here
    model-name: hy_AM-medium
    voice-identifier: gor-medium
logging:
  level:
    com.blbulyandavbulyan.larm: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder:
    com.blbulyandavbulyan.larm.ai.chat.advisor.LoggingProxyAdvisor: INFO
    org.springframework.security: TRACE
    org.springframework.security.oauth2: TRACE
