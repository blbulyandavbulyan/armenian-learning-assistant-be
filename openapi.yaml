openapi: 3.1.0
info:
  description: Backend service for generating and managing Armenian learning phrases
    using AI and TTS.
  title: Armenian Learning Assistant API
  version: 0.0.1
servers:
- description: Generated server url
  url: http://localhost
tags:
- description: "Spaced repetition queue, exercise sessions and history"
  name: Exercises
- description: Endpoints for managing and retrieving media assets
  name: Assets
- description: Enrol content (dialogues) for spaced repetition study
  name: Learning items
- description: Endpoints for interacting with AI to generate dialoguePhrases and content
  name: Chat
- description: Endpoints for saving Armenian dialogues generated by AI
  name: Dialogues
paths:
  /assets/{mediaId}:
    get:
      description: |
        Retrieves the binary content (e.g., audio file) associated with a specific media ID. The content-type of the response depends on the stored asset.
      operationId: getAsset
      parameters:
      - description: UUID of the media asset to retrieve
        in: path
        name: mediaId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/octet-stream: {}
          description: Asset found and returned
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Asset not found for the given media ID
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Internal Server Error
      summary: Get asset by media ID
      tags:
      - Assets
  /chat/dialogue:
    post:
      description: |
        Sends a user message and a chat ID to the AI model to generate a structured Armenian dialogue, including speakers, their phrases, transcriptions, and translations based on the provided context.
      operationId: dialogueChat
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Chat Request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dialogue Chat Response"
          description: Successfully generated dialogue and descriptive message
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Validation Error Response"
          description: Validation failed
      summary: Generate a structured dialogue using AI
      tags:
      - Chat
  /dialogues:
    post:
      description: |
        Accepts a dialogue generated by /chat/dialogue. Saves all speakers, phrases (with TTS audio), and the dialogue metadata (including an embedding for semantic deduplication). Returns the ID of the created dialogue.
      operationId: saveDialogue
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Save Dialogue Request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Save Dialogue Response"
          description: Dialogue saved successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Validation Error Response"
          description: Validation failed
      summary: Save a generated dialogue
      tags:
      - Dialogues
  /dialogues/search:
    get:
      description: Searches for dialogues by their semantic similarity to the given
        query
      operationId: searchDialogues
      parameters:
      - in: query
        name: query
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Search DialoguesResponse"
          description: Successfully retrieved the requested page of dialogues
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Validation Error Response"
          description: Validation failed
      summary: Search dialogues semantically
      tags:
      - Dialogues
  /dialogues/{id}:
    get:
      description: "Returns a complete dialogue including its title, speakers, and\
        \ phrases."
      operationId: getDialogue
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Get Dialogue Response"
          description: Dialogue found
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Dialogue not found
      summary: Get a dialogue by ID
      tags:
      - Dialogues
  /exercises/history:
    get:
      operationId: getHistory
      parameters:
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: exerciseType
        required: false
        schema:
          type: string
          enum:
          - TYPING
      - in: query
        name: contentItemType
        required: false
        schema:
          type: string
          enum:
          - DIALOGUE
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Validation Error Response"
          description: Validation failed
      summary: "Completed sessions, newest first"
      tags:
      - Exercises
  /exercises/queue:
    get:
      operationId: getQueue
      parameters:
      - in: query
        name: exerciseType
        required: false
        schema:
          type: string
          enum:
          - TYPING
      - in: query
        name: contentItemType
        required: false
        schema:
          type: string
          enum:
          - DIALOGUE
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Validation Error Response"
          description: Validation failed
      summary: "Cards due for review, oldest due first"
      tags:
      - Exercises
  /exercises/sessions:
    post:
      operationId: startSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Start Session Request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session Response"
          description: Open session resumed
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session Response"
          description: Session created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Validation Error Response"
          description: Validation failed
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session Response"
          description: Card not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session Response"
          description: Learning item is excluded
      summary: "Start a session for a card, or resume its open session"
      tags:
      - Exercises
  /exercises/sessions/{sessionId}:
    get:
      operationId: getSession
      parameters:
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session Status Response"
          description: Found
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Validation Error Response"
          description: Validation failed
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session Status Response"
          description: Session not found
      summary: "Session state with all attempts, for resuming after a restart"
      tags:
      - Exercises
  /exercises/sessions/{sessionId}/attempts:
    post:
      operationId: submitAttempt
      parameters:
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Attempt Request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attempt Response"
          description: Evaluated
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Validation Error Response"
          description: Validation failed
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attempt Response"
          description: Session not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attempt Response"
          description: "Session completed, or sub-item not part of the session"
      summary: Evaluate one answer; retries of the same sub-item are allowed
      tags:
      - Exercises
  /exercises/sessions/{sessionId}/complete:
    post:
      operationId: completeSession
      parameters:
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complete Session Response"
          description: Completed
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Validation Error Response"
          description: Validation failed
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complete Session Response"
          description: Session not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complete Session Response"
          description: "Sub-items without attempts, or already completed"
      summary: Complete the session and schedule the next review
      tags:
      - Exercises
  /learning-items:
    get:
      operationId: findByContent
      parameters:
      - in: query
        name: contentItemId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: contentItemType
        required: true
        schema:
          type: string
          enum:
          - DIALOGUE
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Learning Item Response"
          description: Found
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Learning Item Response"
          description: Not enrolled or excluded
      summary: Find the active learning item of a content item
      tags:
      - Learning items
    post:
      description: "Enrols the content item and creates one card per exercise type\
        \ and speaker, due immediately. Enrolling again re-activates an excluded item\
        \ and creates missing cards; progress is kept."
      operationId: enrol
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Enrol Learning Item Request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Learning Item Response"
          description: "Already enrolled, re-activated"
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Learning Item Response"
          description: Enrolled
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Validation Error Response"
          description: Validation failed
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Learning Item Response"
          description: Content item not found
      summary: Enrol a content item
      tags:
      - Learning items
  /learning-items/{learningItemId}:
    delete:
      operationId: exclude
      parameters:
      - in: path
        name: learningItemId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Excluded
        "404":
          description: Learning item not found
      summary: Exclude a learning item from studying; progress is kept
      tags:
      - Learning items
  /learning-items/{learningItemId}/cards:
    get:
      operationId: getCards
      parameters:
      - in: path
        name: learningItemId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Learning Cards Response"
          description: Found
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Learning Cards Response"
          description: Learning item not found
      summary: Get the spaced repetition cards of a learning item
      tags:
      - Learning items
components:
  schemas:
    Answer Request:
      description: The answer; the type field selects the kind of answer
      discriminator:
        mapping:
          TEXT: "#/components/schemas/Text Answer Request"
        propertyName: type
      oneOf:
      - $ref: "#/components/schemas/Text Answer Request"
      properties:
        type:
          type: string
      required:
      - type
    Asset Response:
      type: object
      properties:
        contentType:
          type: string
          description: Content type
          example: audio/wav
        url:
          type: string
          description: Asset URL
          example: http://localhost:8080/assets/c9b251f7-0824-4675-854d-354c063f8045
      required:
      - contentType
      - url
    Attempt History Response:
      type: object
      properties:
        answerText:
          type: string
          description: The typed text
        answerType:
          type: string
          description: Kind of answer
          enum:
          - TEXT
        attemptId:
          type: string
          format: uuid
          description: Id of the attempt
        correct:
          type: boolean
          description: Whether the answer matched the expected answer exactly (independent
            of hints)
        evaluatedAt:
          type: string
          format: date-time
          description: When the attempt was evaluated
        quality:
          type: integer
          format: int32
          description: SM-2 quality 0-5 after the hint penalty
        usedHint:
          type: boolean
          description: Whether the user looked at a hint; lowers the quality by one
      required:
      - answerType
      - attemptId
      - correct
      - evaluatedAt
      - quality
      - usedHint
    Attempt Request:
      type: object
      properties:
        answer:
          $ref: "#/components/schemas/Answer Request"
          description: The answer; the type field selects the kind of answer
        contentSubItemId:
          type: string
          format: uuid
          description: Id of the sub-item being answered; for dialogues the dialogue
            phrase id
        usedHint:
          type: boolean
          description: Whether the user looked at a hint; lowers the quality by one
      required:
      - answer
      - contentSubItemId
    Attempt Response:
      type: object
      properties:
        attemptId:
          type: string
          format: uuid
          description: Id of the attempt
        contentSubItemId:
          type: string
          format: uuid
          description: Id of the sub-item being answered; for dialogues the dialogue
            phrase id
        correct:
          type: boolean
          description: Whether the answer matched the expected answer exactly (independent
            of hints)
        expectedText:
          type: string
          description: "Correct answer, only present when the answer was not correct"
        quality:
          type: integer
          format: int32
          description: SM-2 quality 0-5 after the hint penalty
        usedHint:
          type: boolean
          description: Whether the user looked at a hint; lowers the quality by one
      required:
      - attemptId
      - contentSubItemId
      - correct
      - quality
      - usedHint
    Attempted Sub Item Response:
      type: object
      properties:
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/Attempt History Response"
        contentSubItemId:
          type: string
          format: uuid
          description: Id of the sub-item being answered; for dialogues the dialogue
            phrase id
      required:
      - attempts
      - contentSubItemId
    Card Update Response:
      type: object
      properties:
        easeFactor:
          type: number
          format: double
          description: SM-2 ease factor (minimum 1.3); higher means intervals grow
            faster
        nextIntervalDays:
          type: integer
          format: int32
          description: Review interval in days after this session
        nextReviewAt:
          type: string
          format: date-time
          description: When the card is due for its next review
        previousIntervalDays:
          type: integer
          format: int32
          description: Review interval in days before this session
      required:
      - easeFactor
      - nextIntervalDays
      - nextReviewAt
      - previousIntervalDays
    Chat Request:
      type: object
      properties:
        chatId:
          type: string
          format: uuid
          description: "Id of the conversation (chat), to preserve the memory in context"
          example: 5d9e3e04-c848-44a0-8d25-103aaecf1856
        message:
          type: string
          description: "Request message, to tell the AI what to do"
          example: "Hello, could you please generate phrases for going into groceries\
            \ store?"
          minLength: 1
      required:
      - chatId
      - message
    Chat Translation Response:
      type: object
      properties:
        isoLanguageCode:
          type: string
          description: ISO 639-1 language code
        translationText:
          type: string
          description: Generated translation text
      required:
      - isoLanguageCode
      - translationText
    Complete Session Response:
      type: object
      properties:
        aggregateScore:
          type: integer
          format: int32
          description: Session score 0-100
        cardUpdate:
          $ref: "#/components/schemas/Card Update Response"
        completedAt:
          type: string
          format: date-time
          description: When the session was completed; null while in progress
        sessionId:
          type: string
          format: uuid
          description: Id of the exercise session
      required:
      - aggregateScore
      - cardUpdate
      - completedAt
      - sessionId
    Dialogue Chat Response:
      type: object
      properties:
        dialoguePhrases:
          type: array
          items:
            $ref: "#/components/schemas/Dialogue Phrase Response"
        info:
          $ref: "#/components/schemas/Dialogue Title Response"
        message:
          type: string
          description: Response message (description of the results) from AI model
          example: Here are the phrases for grocery store
        speakers:
          type: array
          items:
            $ref: "#/components/schemas/Speaker Response"
      required:
      - dialoguePhrases
      - info
      - message
      - speakers
    Dialogue Phrase Response:
      type: object
      properties:
        phrase:
          $ref: "#/components/schemas/Draft Phrases Response"
        speakerId:
          type: string
          description: Identifier linking a phrase to a specific speaker
          example: 519f4266-17c2-46fc-a761-f0ef0021e4f1
      required:
      - phrase
      - speakerId
    Dialogue Summary Response:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The UUID of the saved dialogue
          examples:
          - 831a5d64-74c5-4a1e-989e-ab1c310c17f2
        title:
          $ref: "#/components/schemas/Phrase Response"
      required:
      - id
    Dialogue Title Response:
      type: object
      properties:
        title:
          type: string
          description: Dialogue title
          example: Խանութում
        transcription:
          type: string
          description: Generated transcription (in English letters)
          example: Khanutum
        translations:
          type: array
          example:
          - isoLanguageCode: ru
            translationText: В магазине
          items:
            $ref: "#/components/schemas/Chat Translation Response"
      required:
      - title
      - transcription
      - translations
    Draft Phrases Response:
      type: object
      properties:
        isoLanguageCode:
          type: string
          description: ISO 639-1 language code
          example: hy
        phrase:
          type: string
          description: Generated phrase
          example: "Որտե՞ղ է հացի բաժինը:"
        transcription:
          type: string
          description: Generated transcription (in English letters)
          example: Vortegh e hatsi bazhiny?
        translations:
          type: array
          example:
          - isoLanguageCode: ru
            translationText: Где находится отдел хлеба?
          items:
            $ref: "#/components/schemas/Chat Translation Response"
      required:
      - isoLanguageCode
      - phrase
      - transcription
      - translations
    Enrol Learning Item Request:
      type: object
      properties:
        contentItemId:
          type: string
          format: uuid
          description: "Id of the learnable content item, e.g. the dialogue id"
        contentItemType:
          type: string
          description: Type of the content item
          enum:
          - DIALOGUE
      required:
      - contentItemId
      - contentItemType
    Get Dialogue Phrase Response:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: "Id of this line of the dialogue (dialogue phrase), used as\
            \ sub-item id in exercises"
        phrase:
          $ref: "#/components/schemas/Phrase Response"
        speakerId:
          type: string
          format: uuid
          description: Identifier linking a phrase to a specific speaker
          examples:
          - 519f4266-17c2-46fc-a761-f0ef0021e4f1
      required:
      - id
      - phrase
      - speakerId
    Get Dialogue Response:
      type: object
      properties:
        dialoguePhrases:
          type: array
          items:
            $ref: "#/components/schemas/Get Dialogue Phrase Response"
        id:
          type: string
          format: uuid
          description: The UUID of the saved dialogue
          examples:
          - 831a5d64-74c5-4a1e-989e-ab1c310c17f2
        speakers:
          type: array
          items:
            $ref: "#/components/schemas/Get Dialogue Speaker Response"
        title:
          $ref: "#/components/schemas/Phrase Response"
      required:
      - dialoguePhrases
      - id
      - speakers
      - title
    Get Dialogue Speaker Response:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identifier linking a phrase to a specific speaker
          examples:
          - 519f4266-17c2-46fc-a761-f0ef0021e4f1
        name:
          $ref: "#/components/schemas/Phrase Response"
      required:
      - id
      - name
    Learning Card Response:
      type: object
      properties:
        easeFactor:
          type: number
          format: double
          description: SM-2 ease factor (minimum 1.3); higher means intervals grow
            faster
        exerciseType:
          type: string
          description: "Type of exercise, defines how answers are given and evaluated"
          enum:
          - TYPING
        intervalDays:
          type: integer
          format: int32
          description: Current review interval in days
        learningCardId:
          type: string
          format: uuid
          description: Id of the spaced repetition card (one per exercise type and
            variant)
        learningItemId:
          type: string
          format: uuid
          description: Id of the user's enrolment of a content item
        nextReviewAt:
          type: string
          format: date-time
          description: When the card is due for its next review
        repetitionCount:
          type: integer
          format: int32
          description: Number of successful reviews in a row
        variantId:
          type: string
          format: uuid
          description: Part of the content practised separately; for dialogues the
            id of the speaker the user plays
      required:
      - easeFactor
      - exerciseType
      - intervalDays
      - learningCardId
      - learningItemId
      - nextReviewAt
      - repetitionCount
    Learning Cards Response:
      type: object
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Learning Card Response"
    Learning Item Response:
      type: object
      properties:
        contentItemId:
          type: string
          format: uuid
          description: "Id of the learnable content item, e.g. the dialogue id"
        contentItemType:
          type: string
          description: Type of the content item
          enum:
          - DIALOGUE
        enrolledAt:
          type: string
          format: date-time
          description: When the user first enrolled the content item
        excludedAt:
          type: string
          format: date-time
          description: When the user excluded the item from studying; null while active
        id:
          type: string
          format: uuid
          description: Id of the user's enrolment of a content item
      required:
      - contentItemId
      - contentItemType
      - enrolledAt
      - id
    Phrase Response:
      type: object
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/Asset Response"
        id:
          type: string
          format: uuid
          description: Id of the phrase
          example: 54c6f12c-4201-48fc-80e4-299bae5b75db
        isoLanguageCode:
          type: string
          description: ISO 639-1 language code
          example: hy
        phrase:
          type: string
          description: Approved phrase
          example: "Որտե՞ղ է հացի բաժինը:"
        transcription:
          type: string
          description: Approved transcription
          example: Vortegh e hatsi bazhiny?
        translations:
          type: array
          items:
            $ref: "#/components/schemas/Phrase Translation"
      required:
      - assets
      - id
      - isoLanguageCode
      - phrase
      - transcription
      - translations
    Phrase Translation:
      type: object
      properties:
