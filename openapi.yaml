    Session Response:
      type: object
      properties:
        completedAt:
          type: string
          format: date-time
          description: When the session was completed; null while in progress
        contentItemId:
          type: string
          format: uuid
          description: "Id of the learnable content item, e.g. the dialogue id"
        contentItemType:
          type: string
          description: Type of the content item
          enum:
          - DIALOGUE
        exerciseType:
          type: string
          description: "Type of exercise, defines how answers are given and evaluated"
          enum:
          - TYPING
        learningCardId:
          type: string
          format: uuid
          description: Id of the spaced repetition card (one per exercise type and
            variant)
        learningItemId:
          type: string
          format: uuid
          description: Id of the user's enrolment of a content item
        sessionId:
          type: string
          format: uuid
          description: Id of the exercise session
        startedAt:
          type: string
          format: date-time
          description: When the session was started
        subItemIds:
          type: array
          description: "Sub-items the user has to answer in this session, in order"
          items:
            type: string
            format: uuid
        variantId:
          type: string
          format: uuid
          description: Part of the content practised separately; for dialogues the
            id of the speaker the user plays
      required:
      - contentItemId
      - contentItemType
      - exerciseType
      - learningCardId
      - learningItemId
      - sessionId
      - startedAt
      - subItemIds
    Session Status Response:
      type: object
      properties:
        attemptedSubItems:
          type: array
          items:
            $ref: "#/components/schemas/Attempted Sub Item Response"
        pendingSubItemIds:
          type: array
          description: Sub-items of the session without any attempt yet
          items:
            type: string
            format: uuid
        session:
          $ref: "#/components/schemas/Session Response"
      required:
      - attemptedSubItems
      - pendingSubItemIds
      - session
    Speaker Response:
      type: object
      properties:
        id:
          type: string
          description: Identifier linking a phrase to a specific speaker
          example: 519f4266-17c2-46fc-a761-f0ef0021e4f1
        title:
          type: string
          description: Speaker title
          example: Գնորդ
        transcription:
          type: string
          description: Generated transcription (in English letters)
          example: Gnord
        translations:
          type: array
          example:
          - isoLanguageCode: ru
            translationText: Покупатель
          items:
            $ref: "#/components/schemas/Chat Translation Response"
      required:
      - id
      - title
      - transcription
      - translations
    Start Session Request:
      type: object
      properties:
        learningCardId:
          type: string
          format: uuid
          description: Id of the spaced repetition card (one per exercise type and
            variant)
      required:
      - learningCardId
    Text Answer Request:
      allOf:
      - $ref: "#/components/schemas/Answer Request"
      - type: object
        properties:
          text:
            type: string
            description: The typed text
            maxLength: 1000
            minLength: 0
      required:
      - text
    Validation Error Response:
      type: object
      properties:
        error:
          type: string
          description: Error type summary
          example: Validation Failed
        errors:
          type: object
          additionalProperties:
            type: string
          description: Map of field names to their validation error messages
        path:
          type: string
          description: The path where the error occurred
          example: /phrases
        status:
          type: integer
          format: int32
          description: HTTP status code
          example: 400
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the error
          example: 2023-10-27T10:00:00
