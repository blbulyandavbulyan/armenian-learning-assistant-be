openapi: 3.1.0
info:
  description: Backend service for generating and managing Armenian learning phrases
    using AI and TTS.
  title: Armenian Learning Assistant API
  version: 0.0.1
servers:
- description: Generated server url
  url: http://localhost
tags:
- description: Endpoints for managing and retrieving media assets
  name: Assets
- description: Endpoints for interacting with AI to generate dialoguePhrases and content
  name: Chat
- description: Endpoints for saving Armenian dialogues generated by AI
  name: Dialogues
paths:
  /assets/{mediaId}:
    get:
      description: |
        Retrieves the binary content (e.g., audio file) associated with a specific media ID. The content-type of the response depends on the stored asset.
      operationId: getAsset
      parameters:
      - description: UUID of the media asset to retrieve
        in: path
        name: mediaId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/octet-stream: {}
          description: Asset found and returned
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Asset not found for the given media ID
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Internal Server Error
      summary: Get asset by media ID
      tags:
      - Assets
  /chat/dialogue:
    post:
      description: |
        Sends a user message and a chat ID to the AI model to generate a structured Armenian dialogue, including speakers, their phrases, transcriptions, and translations based on the provided context.
      operationId: dialogueChat
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Chat Request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dialogue Chat Response"
          description: Successfully generated dialogue and descriptive message
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Validation Error Response"
          description: Validation failed
      summary: Generate a structured dialogue using AI
      tags:
      - Chat
  /dialogues:
    post:
      description: |
        Accepts a dialogue generated by /chat/dialogue. Saves all speakers, phrases (with TTS audio), and the dialogue metadata (including an embedding for semantic deduplication). Returns the ID of the created dialogue.
      operationId: saveDialogue
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Save Dialogue Request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Save Dialogue Response"
          description: Dialogue saved successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Validation Error Response"
          description: Validation failed
      summary: Save a generated dialogue
      tags:
      - Dialogues
  /dialogues/search:
    get:
      description: Searches for dialogues by their semantic similarity to the given
        query
      operationId: searchDialogues
      parameters:
      - in: query
        name: query
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Search DialoguesResponse"
          description: Successfully retrieved the requested page of dialogues
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Validation Error Response"
          description: Validation failed
      summary: Search dialogues semantically
      tags:
      - Dialogues
  /dialogues/{id}:
    get:
      description: "Returns a complete dialogue including its title, speakers, and\
        \ phrases."
      operationId: getDialogue
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Get Dialogue Response"
          description: Dialogue found
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Dialogue not found
      summary: Get a dialogue by ID
      tags:
      - Dialogues
components:
  schemas:
    Asset Response:
      type: object
      properties:
        contentType:
          type: string
          description: Content type
          example: audio/wav
        url:
          type: string
          description: Asset URL
          example: http://localhost:8080/assets/c9b251f7-0824-4675-854d-354c063f8045
      required:
      - contentType
      - url
    Chat Request:
      type: object
      properties:
        chatId:
          type: string
          format: uuid
          description: "Id of the conversation (chat), to preserve the memory in context"
          example: 5d9e3e04-c848-44a0-8d25-103aaecf1856
        message:
          type: string
          description: "Request message, to tell the AI what to do"
          example: "Hello, could you please generate phrases for going into groceries\
            \ store?"
          minLength: 1
      required:
      - chatId
      - message
    Chat Translation Response:
      type: object
      properties:
        isoLanguageCode:
          type: string
          description: ISO 639-1 language code
        translationText:
          type: string
          description: Generated translation text
      required:
      - isoLanguageCode
      - translationText
    Dialogue Chat Response:
      type: object
      properties:
        dialoguePhrases:
          type: array
          items:
            $ref: "#/components/schemas/Dialogue Phrase Response"
        info:
          $ref: "#/components/schemas/Dialogue Title Response"
        message:
          type: string
          description: Response message (description of the results) from AI model
          example: Here are the phrases for grocery store
        speakers:
          type: array
          items:
            $ref: "#/components/schemas/Speaker Response"
      required:
      - dialoguePhrases
      - info
      - message
      - speakers
    Dialogue Phrase Response:
      type: object
      properties:
        phrase:
          $ref: "#/components/schemas/Draft Phrases Response"
        speakerId:
          type: string
          description: Identifier linking a phrase to a specific speaker
          example: 519f4266-17c2-46fc-a761-f0ef0021e4f1
      required:
      - phrase
      - speakerId
    Dialogue Summary Response:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The UUID of the saved dialogue
          examples:
          - 831a5d64-74c5-4a1e-989e-ab1c310c17f2
        title:
          $ref: "#/components/schemas/Phrase Response"
      required:
      - id
    Dialogue Title Response:
      type: object
      properties:
        title:
          type: string
          description: Dialogue title
          example: Խանութում
        transcription:
          type: string
          description: Generated transcription (in English letters)
          example: Khanutum
        translations:
          type: array
          example:
          - isoLanguageCode: ru
            translationText: В магазине
          items:
            $ref: "#/components/schemas/Chat Translation Response"
      required:
      - title
      - transcription
      - translations
    Draft Phrases Response:
      type: object
      properties:
        isoLanguageCode:
          type: string
          description: ISO 639-1 language code
          example: hy
        phrase:
          type: string
          description: Generated phrase
          example: "Որտե՞ղ է հացի բաժինը:"
        transcription:
          type: string
          description: Generated transcription (in English letters)
          example: Vortegh e hatsi bazhiny?
        translations:
          type: array
          example:
          - isoLanguageCode: ru
            translationText: Где находится отдел хлеба?
          items:
            $ref: "#/components/schemas/Chat Translation Response"
      required:
      - isoLanguageCode
      - phrase
      - transcription
      - translations
    Get Dialogue Phrase Response:
      type: object
      properties:
        phrase:
          $ref: "#/components/schemas/Phrase Response"
        speakerId:
          type: string
          format: uuid
          description: Identifier linking a phrase to a specific speaker
          examples:
          - 519f4266-17c2-46fc-a761-f0ef0021e4f1
      required:
      - phrase
      - speakerId
    Get Dialogue Response:
      type: object
      properties:
        dialoguePhrases:
          type: array
          items:
            $ref: "#/components/schemas/Get Dialogue Phrase Response"
        id:
          type: string
          format: uuid
          description: The UUID of the saved dialogue
          examples:
          - 831a5d64-74c5-4a1e-989e-ab1c310c17f2
        speakers:
          type: array
          items:
            $ref: "#/components/schemas/Get Dialogue Speaker Response"
        title:
          $ref: "#/components/schemas/Phrase Response"
      required:
      - dialoguePhrases
      - id
      - speakers
      - title
    Get Dialogue Speaker Response:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identifier linking a phrase to a specific speaker
          examples:
          - 519f4266-17c2-46fc-a761-f0ef0021e4f1
        name:
          $ref: "#/components/schemas/Phrase Response"
      required:
      - id
      - name
    Phrase Response:
      type: object
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/Asset Response"
        id:
          type: string
          format: uuid
          description: Id of the phrase
          example: 54c6f12c-4201-48fc-80e4-299bae5b75db
        isoLanguageCode:
          type: string
          description: ISO 639-1 language code
          example: hy
        phrase:
          type: string
          description: Approved phrase
          example: "Որտե՞ղ է հացի բաժինը:"
        transcription:
          type: string
          description: Approved transcription
          example: Vortegh e hatsi bazhiny?
        translations:
          type: array
          items:
            $ref: "#/components/schemas/Phrase Translation"
      required:
      - assets
      - id
      - isoLanguageCode
      - phrase
      - transcription
      - translations
    Phrase Translation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Translation ID
          example: 1ae940f2-1798-4b64-8f04-2f845df8dfe5
        isoLanguageCode:
          type: string
          description: ISO 639-1 language code
          example: ru
        translationText:
          type: string
          description: Approved translation text
          example: Где находится отдел хлеба?
      required:
      - id
      - isoLanguageCode
      - translationText
    ProblemDetail:
      type: object
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
    Save Dialogue Phrase Inner Request:
      type: object
      properties:
        isoLanguageCode:
          type: string
          description: ISO 639-1 language code
          example: hy
          minLength: 1
        phrase:
          type: string
          description: Generated phrase
          example: "Որտե՞ղ է հացի բաժինը:"
          minLength: 1
        transcription:
          type: string
          description: Generated transcription (in English letters)
          example: Vortegh e hatsi bazhiny?
          minLength: 1
        translations:
          type: array
          example:
          - isoLanguageCode: ru
            translationText: Где находится отдел хлеба?
          items:
            $ref: "#/components/schemas/Save Dialogue Translation Request"
          minItems: 1
      required:
      - isoLanguageCode
      - phrase
      - transcription
      - translations
    Save Dialogue Phrase Request:
      type: object
      properties:
        phrase:
          $ref: "#/components/schemas/Save Dialogue Phrase Inner Request"
        speakerId:
          type: string
          description: Identifier linking a phrase to a specific speaker
          example: 519f4266-17c2-46fc-a761-f0ef0021e4f1
          minLength: 1
      required:
      - phrase
      - speakerId
    Save Dialogue Request:
      type: object
      properties:
        dialoguePhrases:
          type: array
          description: List of phrases spoken in the dialogue in chronological order
          items:
            $ref: "#/components/schemas/Save Dialogue Phrase Request"
          minItems: 1
        info:
          $ref: "#/components/schemas/Save Dialogue Title Request"
          description: Dialogue title information
        speakers:
          type: array
          description: List of speakers in the dialogue
          items:
            $ref: "#/components/schemas/Save Speaker Request"
          minItems: 1
      required:
      - dialoguePhrases
      - info
      - speakers
    Save Dialogue Response:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The UUID of the saved dialogue
          examples:
          - 831a5d64-74c5-4a1e-989e-ab1c310c17f2
      required:
      - id
    Save Dialogue Title Request:
      type: object
      properties:
        title:
          type: string
          description: Dialogue title
          example: Խանութում
          minLength: 1
        transcription:
          type: string
          description: Generated transcription (in English letters)
          example: Khanutum
          minLength: 1
        translations:
          type: array
          example:
          - isoLanguageCode: ru
            translationText: В магазине
          items:
            $ref: "#/components/schemas/Save Dialogue Translation Request"
          minItems: 1
      required:
      - title
      - transcription
      - translations
    Save Dialogue Translation Request:
      type: object
      properties:
        isoLanguageCode:
          type: string
          description: ISO 639-1 language code
          minLength: 1
        translationText:
          type: string
          description: Generated translation text
          minLength: 1
      required:
      - isoLanguageCode
      - translationText
    Save Speaker Request:
      type: object
      properties:
        id:
          type: string
          description: Identifier linking a phrase to a specific speaker
          example: 519f4266-17c2-46fc-a761-f0ef0021e4f1
          minLength: 1
        title:
          type: string
          description: Speaker title
          example: Գնորդ
          minLength: 1
        transcription:
          type: string
          description: Generated transcription (in English letters)
          example: Gnord
          minLength: 1
        translations:
          type: array
          example:
          - isoLanguageCode: ru
            translationText: Покупатель
          items:
            $ref: "#/components/schemas/Save Dialogue Translation Request"
          minItems: 1
      required:
      - id
      - title
      - transcription
      - translations
    Search DialoguesResponse:
      type: object
      properties:
        dialogues:
          type: array
          items:
            $ref: "#/components/schemas/Dialogue Summary Response"
    Speaker Response:
      type: object
      properties:
        id:
          type: string
          description: Identifier linking a phrase to a specific speaker
          example: 519f4266-17c2-46fc-a761-f0ef0021e4f1
        title:
          type: string
          description: Speaker title
          example: Գնորդ
        transcription:
          type: string
          description: Generated transcription (in English letters)
          example: Gnord
        translations:
          type: array
          example:
          - isoLanguageCode: ru
            translationText: Покупатель
          items:
            $ref: "#/components/schemas/Chat Translation Response"
      required:
      - id
      - title
      - transcription
      - translations
    Validation Error Response:
      type: object
      properties:
        error:
          type: string
          description: Error type summary
          example: Validation Failed
        errors:
          type: object
          additionalProperties:
            type: string
          description: Map of field names to their validation error messages
        path:
          type: string
          description: The path where the error occurred
          example: /phrases
        status:
          type: integer
          format: int32
          description: HTTP status code
          example: 400
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the error
          example: 2023-10-27T10:00:00
